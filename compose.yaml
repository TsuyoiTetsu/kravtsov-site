services:
  web:
    build: .
    container_name: kravtsovsite
    restart: unless-stopped
    ports:
      - "8016:8016"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8016/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 45
      start_period: 10s
